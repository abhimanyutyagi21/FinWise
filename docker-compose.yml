# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finwise
      POSTGRES_PASSWORD: finwise
      POSTGRES_DB: finwise
    ports:
      - "5432:5432"
    volumes:
      - finwise-pg:/var/lib/postgresql/data
volumes:
  finwise-pg:
